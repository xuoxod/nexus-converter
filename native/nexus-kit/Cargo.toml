[package]
name = "nexus-kit"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
infer = "0.15"
log = "0.4"

[features]
# Enable deep validation using FFmpeg probing
probe = ["dep:ffmpeg-next"]

[dependencies.ffmpeg-next]
version = "7.1.0"
optional = true

[dev-dependencies]
tempfile = "3"
